[project]
name = "dolctl"
version = "0.1.1"
description = "DoL launcher CLI"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12.0",
  "httpx>=0.27.0",
  "tomli-w>=1.0.0",
  "textual>=0.60",
]

[project.scripts]
dolctl = "dolctl.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["dolctl*", "core*", "infra*", "providers*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.4.0",
  "mypy>=1.8.0",
  "pytest-asyncio>=1.3.0",
]
